<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Midnight Deck — Three Cards</title><link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>body{font-family:'Marcellus',serif;background:radial-gradient(#241b3a,#0e0a18 70%);color:#e8ddff;text-align:center;padding:8vh 4vw}
h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.15em}
.deck{display:flex;gap:26px;justify-content:center;margin:60px 0;flex-wrap:wrap}
.card{width:170px;height:290px;border:2px solid #c9a227;border-radius:12px;background:#161028;display:grid;place-items:center;font-size:4rem;cursor:pointer;transition:.5s;position:relative;transform-style:preserve-3d}
.card:hover{transform:rotateY(12deg) translateY(-10px);box-shadow:0 24px 50px #c9a22733}
.card span{position:absolute;bottom:12px;left:0;right:0;font-size:.75rem;letter-spacing:.2em;opacity:0;transition:.4s}
.card.open span{opacity:1}
.reading{max-width:560px;margin:auto;min-height:120px;font-style:italic;line-height:1.9;font-size:1.15rem;color:#d9b8ff}</style></head><body><h1>THE MIDNIGHT DECK</h1><p style="opacity:.7">tap three cards · the universe will paraphrase</p>
<div class="deck" id="deck"></div><div class="reading" id="out">…</div><script>const CARDS=[['🌙','THE MOON','Intuition over itinerary. Trust the tide you can't see.'],['☀️','THE SUN','Unironic joy available today. Coupon attached.'],['🗝','THE KEY','A door you called "someday" is actually a hinge.'],['🌊','THE TIDE','Feelings are weather, not geography. Walk through.'],['🦉','THE OWL','Ask the embarrassing question. It's the only useful one.'],['⚡','THE SPARK','Start messy. Momentum forgives form.'],['🪞','THE MIRROR','You already know who to text. Do it.'],['🕰','THE HOUR','Not late — precisely on your schedule.']];
const deck=document.getElementById('deck'),out=document.getElementById('out');let chosen=[],pool=[...CARDS].sort(()=>Math.random()-.5);
for(let i=0;i<8;i++){const c=document.createElement('div');c.className='card';c.innerHTML=`${pool[i][0]}<span>${pool[i][1]}</span>`;
c.onclick=()=>{if(c.classList.contains('open'))return;c.classList.add('open');chosen.push(pool[i]);
if(chosen.length===3){out.textContent=`${chosen.map((x,j)=>`${['PAST','PRESENT','PATH'][j]}: ${x[2]}`).join(' · ')} — shuffled by the midnight desk.`}};
deck.appendChild(c)}</script></body></html>
