<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festival of Lanterns</title><link href="https://fonts.googleapis.com/css2?family=Noto Serif SC&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Serif SC',serif;background:linear-gradient(#090212,#1a0a2e 60%,#2b0f3a);color:#ffe9c9;min-height:100vh;overflow-x:hidden}
.sky{position:relative;min-height:100vh}
.lantern{position:absolute;font-size:2.6rem;animation:rise linear infinite;filter:drop-shadow(0 0 22px #ffb347)}
@keyframes rise{from{transform:translateY(105vh) translateX(0) rotate(-4deg)}to{transform:translateY(-15vh) translateX(var(--sway)) rotate(4deg)}}
h1{text-align:center;font-size:clamp(2.4rem,8vw,4.6rem);padding-top:22vh;letter-spacing:.3em;text-shadow:0 0 40px #ff9e4f}
.sub{text-align:center;opacity:.75;letter-spacing:.5em;font-size:.85rem}
.poem{max-width:560px;margin:24vh auto;padding:0 24px;text-align:center;font-size:1.25rem;line-height:2.2;font-style:italic}</style></head><body><div class="sky" id="s"><h1>灯 火 节</h1><div class="sub">FESTIVAL OF LANTERNS</div></div>
<div class="poem">Ten thousand paper suns<br>loosen from the riverbank —<br>the night keeps receipts.</div><script>const s=document.getElementById('s');
for(let i=0;i<22;i++){const l=document.createElement('div');l.className='lantern';l.textContent=['🏮','🪔','🕯️'][i%3];
l.style.left=Math.random()*96+'vw';l.style.setProperty('--sway',(Math.random()*120-60)+'px');
l.style.animationDuration=(11+Math.random()*14)+'s';l.style.animationDelay=-Math.random()*20+'s';s.appendChild(l)}</script></body></html>
